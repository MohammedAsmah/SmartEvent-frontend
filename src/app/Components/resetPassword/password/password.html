<app-navbar />

<section class="vh-100 d-flex justify-content-center align-items-center">
  <div class="card w-50 h-75 text-center">
    <div class="card-header h5 text-white bg-primary">
      Reset Your Password
    </div>

    <div class="card-body px-5">
      <form [formGroup]="passwordForm" (ngSubmit)="onSubmitPassword()">
        <p class="card-text py-2">
          Enter your new password below. Make sure it's strong and secure.
        </p>

        <div class="form-group text-start mb-3">
          <label for="newPassword" class="form-label">New Password</label>
          <input
            type="password"
            id="newPassword"
            class="form-control"
            formControlName="newPassword"
            placeholder="Enter new password"
          />
          <small class="text-muted">
            Password must be at least 8 characters long
          </small>
        </div>

        <div class="form-group text-start mb-4">
          <label for="confirmPassword" class="form-label">Confirm Password</label>
          <input
            type="password"
            id="confirmPassword"
            class="form-control"
            formControlName="confirmPassword"
            placeholder="Re-enter new password"
          />
        </div>

        <button type="submit" class="btn btn-primary w-100" [disabled]="!passwordForm.valid">
          Reset Password
        </button>

        <div class="d-flex justify-content-center mt-4">
          <a href="/auth/login">Back to login</a>
        </div>
      </form>
    </div>

    <p
      [ngStyle]="error_message ? { 'background-color': 'red' } : {}"
      class="mt-2 text-center py-2 rounded text-white"
    >
      {{ error_message }}
    </p>

    <p
      [ngStyle]="success_message ? { 'background-color': '#e8f5e9' } : {}"
      class="mt-2 text-center py-2 rounded text-success"
    >
      {{ success_message }}
    </p>
  </div>
</section>
